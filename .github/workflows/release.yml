name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: artifacts/release/*
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$BUILD_REF" == refs/tags/v* ]]; then
            tag="${BUILD_REF#refs/tags/}"
            gh release create "$tag" release/* --verify-tag --title "Echo $tag" --generate-notes
          else
            tag="development"
            printf 'Automatic Windows development build.\n\nRevision: %s\n\nExtract the ZIP and run Echo.exe. .NET is included. A hardware H.264 encoder is required.\n' "$BUILD_SHA" > notes.md
            if gh release view "$tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$BUILD_SHA" -F force=true
              gh release edit "$tag" --prerelease --title 'Echo development build' --notes-file notes.md
              gh release upload "$tag" release/* --clobber
            else
              gh release create "$tag" release/* --target "$BUILD_SHA" --prerelease --title 'Echo development build' --notes-file notes.md
            fi
          fi
