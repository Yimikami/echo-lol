name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw 'Use a stable version tag such as v0.2.0.'
            }
            $version = $Matches[1]
            if ($version -ne ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version) {
              throw 'The release tag and application version do not match.'
            }
            ./scripts/release.ps1 -InstallerVersion $version
          } else {
            ./scripts/release.ps1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: artifacts/release/*
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$BUILD_REF" == refs/tags/v* ]]; then
            tag="${BUILD_REF#refs/tags/}"
            version="$(printf '%s' "$tag" | cut -c2-)"
            test -s "release/Echo-Setup-$version-x64.exe"
            {
              printf '## Download\n\n'
              printf 'Run **Echo-Setup-%s-x64.exe** on Windows 10 or 11. If you prefer a portable copy, extract **Echo-Windows-x64.zip** and run **Echo.exe**.\n\n' "$version"
              printf '.NET is included. Recording requires a hardware H.264 encoder.\n\n'
            } > notes.md
            gh release create "$tag" release/* --verify-tag --latest --title "Echo $tag" --notes-file notes.md --generate-notes
          else
            tag="development"
            printf 'Automatic Windows development build.\n\nRevision: %s\n\nExtract the ZIP and run Echo.exe. .NET is included. A hardware H.264 encoder is required.\n' "$BUILD_SHA" > notes.md
            if gh release view "$tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$BUILD_SHA" -F force=true
              gh release edit "$tag" --prerelease --title 'Echo development build' --notes-file notes.md
              gh release upload "$tag" release/* --clobber
            else
              gh release create "$tag" release/* --target "$BUILD_SHA" --prerelease --title 'Echo development build' --notes-file notes.md
            fi
          fi
