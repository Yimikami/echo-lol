name: Build and core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Echo.slnx -c Release --nologo
      - run: dotnet run --project tests/Echo.Tests -c Release --no-build
